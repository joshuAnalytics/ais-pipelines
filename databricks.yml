bundle:
  name: ais-pipelines

workspace:
  root_path: /Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

sync:
  include:
    - "notebooks/**/*"

variables:
  # Unity Catalog Configuration
  catalog:
    description: "Unity Catalog catalog name"
    default: ais
  
  schema:
    description: "Unity Catalog schema name"
    default: ais_assets
  
  # Volume Configuration
  source_volume:
    description: "Volume containing full history files"
    default: full_history
  
  landing_volume:
    description: "Volume where files are dripped to"
    default: landing
  
  # Decompressor Configuration
  decompressor_limit:
    description: "Number of files to decompress per run (0 = all files)"
    default: 0
  
  decompressor_delete_compressed:
    description: "Whether to delete compressed files after decompressing"
    default: false
  
  # Download Configuration
  download_target_volume:
    description: "Volume where AIS files will be downloaded"
    default: full_history
  
  download_year:
    description: "Year to download from NOAA"
    default: 2025
  
  download_limit:
    description: "Maximum number of files to download (0 = all files)"
    default: 10
  
  # Create AIS Records Configuration
  create_ais_records_target_table:
    description: "Target table name for AIS records"
    default: ais_records
  
  create_ais_records_limit:
    description: "Maximum number of CSV files to process (0 = all files)"
    default: 10
  
  # Anomaly Features Configuration
  anomaly_features_start_date:
    description: "Start date for anomaly feature generation (YYYY-MM-DD)"
    default: "2024-01-01"
  
  anomaly_features_end_date:
    description: "End date for anomaly feature generation (YYYY-MM-DD)"
    default: "2024-01-10"
  
  anomaly_features_session_gap_hours:
    description: "Hours gap to define session boundaries"
    default: 24
  
  anomaly_features_historical_baseline_days:
    description: "Days for historical baseline patterns"
    default: 5

artifacts:
  # Build your project into a wheel using uv, so the exact env is defined by your pyproject/uv.lock.
  app_wheel:
    type: whl
    path: .
    # `uv build` produces a wheel into ./dist; the job will install that wheel on serverless.
    build: uv build

resources:
  jobs:
    ais_pipeline_full:
      name: "[${bundle.target}] AIS Pipeline - Full"
      tasks:
        - task_key: download_ais
          python_wheel_task:
            package_name: ais_pipelines
            entry_point: download-ais
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--volume"
              - "${var.download_target_volume}"
              - "--year"
              - "${var.download_year}"
              - "--limit"
              - "${var.download_limit}"
          environment_key: default
        
        - task_key: decompress_files
          depends_on:
            - task_key: download_ais
          python_wheel_task:
            package_name: ais_pipelines
            entry_point: decompress
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--history-volume"
              - "${var.source_volume}"
              - "--landing-volume"
              - "${var.landing_volume}"
              - "--limit"
              - "${var.decompressor_limit}"
              - "--delete-compressed"
              - "${var.decompressor_delete_compressed}"
          environment_key: default
        
        - task_key: create_ais_records
          depends_on:
            - task_key: decompress_files
          python_wheel_task:
            package_name: ais_pipelines
            entry_point: create-ais-records
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--landing-volume"
              - "${var.landing_volume}"
              - "--target-table"
              - "${var.create_ais_records_target_table}"
              - "--limit"
              - "${var.create_ais_records_limit}"
          environment_key: default
        
        - task_key: create_anomaly_features
          depends_on:
            - task_key: create_ais_records
          python_wheel_task:
            package_name: ais_pipelines
            entry_point: anomaly-features
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--start-date"
              - "${var.anomaly_features_start_date}"
              - "--end-date"
              - "${var.anomaly_features_end_date}"
              - "--session-gap-hours"
              - "${var.anomaly_features_session_gap_hours}"
              - "--historical-baseline-days"
              - "${var.anomaly_features_historical_baseline_days}"
          environment_key: default
      
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ./dist/*.whl
    
    ais_pipeline_features:
      name: "[${bundle.target}] AIS Pipeline - Features Only"
      tasks:
        - task_key: create_anomaly_features
          python_wheel_task:
            package_name: ais_pipelines
            entry_point: anomaly-features
            parameters:
              - "--catalog"
              - "${var.catalog}"
              - "--schema"
              - "${var.schema}"
              - "--start-date"
              - "${var.anomaly_features_start_date}"
              - "--end-date"
              - "${var.anomaly_features_end_date}"
              - "--session-gap-hours"
              - "${var.anomaly_features_session_gap_hours}"
              - "--historical-baseline-days"
              - "${var.anomaly_features_historical_baseline_days}"
          environment_key: default
      
      environments:
        - environment_key: default
          spec:
            client: "4"
            dependencies:
              - ./dist/*.whl

targets:
  dev:
    default: true
  prod:
    mode: production
