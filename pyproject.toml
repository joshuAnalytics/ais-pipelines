[project]
name = "ais-pipelines"
version = "0.1.0"
description = "AIS data pipelines for Databricks"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "folium>=0.20.0",
    "geopandas",
    "h3>=4.3.1",
    "mapclassify",
    "matplotlib",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pyarrow>=22.0.0",
    "pydeck>=0.9.1",
    "requests",
    "scikit-learn>=1.3.0",
    "seaborn>=0.12.0",
    "tensorflow>=2.15.0",
    "tqdm>=4.60.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.1",
]

[project.scripts]
download-ais = "ais_pipelines.download_ais:main"
decompress = "ais_pipelines.decompress:main"
create-ais-records = "ais_pipelines.create_ais_records:main"
spatial-features = "ais_pipelines.spatial_features:main"
anomaly-features = "ais_pipelines.anomaly_features:main"
anomaly-detection = "ais_pipelines.anomaly_detection:main"
