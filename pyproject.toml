[project]
name = "ais-pipelines"
version = "0.1.0"
description = "AIS data pipelines for Databricks"
requires-python = ">=3.10"
dependencies = [
    "beautifulsoup4",
    "folium>=0.20.0",
    "geopandas",
    "h3>=4.3.1",
    "mapclassify",
    "matplotlib",
    "numpy>=1.20.0",
    "pandas>=1.3.0",
    "pydeck>=0.9.1",
    "requests",
    "tqdm>=4.60.0",
    "zstandard>=0.23.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.14.1",
]

[project.scripts]
download-ais = "ais_pipelines.download_ais:main"
dripper = "ais_pipelines.dripper:main"
autoloader = "ais_pipelines.autoloader:main"
decompress = "ais_pipelines.decompress:main"
